name: eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model tag"
        required: true
        default: "qwen2.5:7b"

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pull model
        run: |
          for i in 1 2 3 4 5; do curl -sf http://localhost:11434/api/tags && break || sleep 5; done
          curl -X POST http://localhost:11434/api/pull -d '{"name":"${{ inputs.model }}"}'
      - run: python -m evals.runner --model ${{ inputs.model }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ inputs.model }}
          path: evals/results/
