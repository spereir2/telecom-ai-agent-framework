[project]
name = "telecom-ai-agent-framework"
version = "0.1.0"
description = "Local-LLM agentic framework for telecom service provisioning workflows"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shaun Pereira", email = "pereira.shaun@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
nl-order = "telecom_ai.cli:app"
kb-ingest = "telecom_ai.rag.cli:ingest"
kb-ask = "telecom_ai.rag.cli:ask"
kb-show = "telecom_ai.rag.cli:show"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "evals"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
